name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache SwiftPM build and dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}-

      - name: Run functional tests (skip E2E UI & timing stress)
        env:
          SWIFTEDIT_RELEASE_PIPELINE: "1"
        run: swift test --no-parallel

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_P12" ]; then
            echo "DEVELOPER_ID_P12 is not configured; building an ad-hoc release."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-keypartition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build app bundle
        run: ./Scripts/build-app.sh --configuration Release --clean --derived-data .tmp/DerivedData

      - name: Re-sign with Developer ID when configured
        env:
          SWIFTEDIT_SIGN_IDENTITY: ${{ secrets.SWIFTEDIT_SIGN_IDENTITY }}
        run: |
          if [ -z "$SWIFTEDIT_SIGN_IDENTITY" ]; then
            exit 0
          fi
          codesign --force --deep --options runtime \
            --entitlements XcodeApp/PH.SwiftEdit.macOS.entitlements \
            --sign "$SWIFTEDIT_SIGN_IDENTITY" \
            .tmp/DerivedData/Build/Products/Release/SwiftEdit.app

      - name: Notarize app
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SWIFTEDIT_SIGN_IDENTITY: ${{ secrets.SWIFTEDIT_SIGN_IDENTITY }}
        run: |
          if [ -z "$NOTARY_KEY_P8" ] || [ -z "$SWIFTEDIT_SIGN_IDENTITY" ]; then
            echo "Notarization secrets are not configured; skipping notarization."
            exit 0
          fi
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent \
            .tmp/DerivedData/Build/Products/Release/SwiftEdit.app \
            "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple .tmp/DerivedData/Build/Products/Release/SwiftEdit.app

      - name: Package release
        run: |
          mkdir -p dist
          ARCHIVE_NAME="PH.SwiftEdit-${GITHUB_REF_NAME//\//-}-macOS-arm64"
          ditto -c -k --sequesterRsrc --keepParent \
            .tmp/DerivedData/Build/Products/Release/SwiftEdit.app \
            "dist/${ARCHIVE_NAME}.zip"
          (cd dist && shasum -a 256 "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256")
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}.zip
            dist/${{ env.ARCHIVE_NAME }}.zip.sha256
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/${ARCHIVE_NAME}.zip" \
              "dist/${ARCHIVE_NAME}.zip.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/${ARCHIVE_NAME}.zip" \
              "dist/${ARCHIVE_NAME}.zip.sha256" \
              --generate-notes
          fi

      - name: Clean temporary build artifacts
        if: always()
        run: rm -rf .tmp
