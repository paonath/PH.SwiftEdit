name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache SwiftPM build and dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}-

      - name: Run SwiftPM tests
        run: swift test --parallel

      - name: Build macOS app bundle
        run: ./Scripts/build-app.sh --configuration Release --clean --derived-data .tmp/DerivedData

      - name: Clean temporary build artifacts
        if: always()
        run: rm -rf .tmp
